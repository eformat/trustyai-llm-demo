apiVersion: v1
kind: ConfigMap
metadata:
  name: guardrails-orchestrator-config
data:
  config.yaml: |
    openai:
      service:
        hostname: phi3-predictor
        port: 8080
    detectors:
      gibberish-detector:
        type: text_contents
        service:
          hostname: gibberish-detector-predictor
          port: 8000
        chunker_id: whole_doc_chunker
        default_threshold: 0.5
      ibm-hate-and-profanity-detector:
        type: text_contents
        service:
          hostname: ibm-hate-and-profanity-detector-predictor
          port: 8000
        chunker_id: whole_doc_chunker
        default_threshold: 0.5
      jailbreak-detector:
        type: text_contents
        service:
          hostname: jailbreak-detector-predictor
          port: 8000
        chunker_id: whole_doc_chunker
        default_threshold: 0.5
      built-in-detector:
        type: text_contents
        service:
          hostname: 127.0.0.1
          port: 8080
        chunker_id: whole_doc_chunker
        default_threshold: 0.5
    passthrough_headers:
      - Authorization
      - Content-Type
      - x-forwarded-access-token
    rewrite_forwarded_access_header: true
